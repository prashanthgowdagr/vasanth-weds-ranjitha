  </div>

  <button id="music-btn" class="music" aria-label="Pause or play music" hidden>
    <svg width="20" height="20" viewBox="0 0 20 20"><g fill="#fff"><rect class="bar" x="3" y="9" width="3" height="8"/><rect class="bar" x="8.5" y="4" width="3" height="13"/><rect class="bar" x="14" y="7" width="3" height="10"/></g></svg>
  </button>

  <div class="page" id="page">

    <!-- ===== Opening page: names + photo ===== -->
    <header class="hero lt-host" id="home">
      <span class="amp-mark script" aria-hidden="true">&amp;</span>
      <p class="top-name left" id="t-groom"></p>
      <p class="top-name right" id="t-bride"></p>
      <span class="names-heart" aria-hidden="true"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="#e11d48"><use href="#heart"/></svg></span>
      <div class="photo">
        <div class="photo-img" data-img="hero"></div>
        <svg class="photo-line" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0.12,0 H0.88 Q0.9,0 0.9,0.02 Q0.9,0.068 0.94,0.068 Q1,0.068 1,0.1 V0.9 Q1,0.932 0.94,0.932 Q0.9,0.932 0.9,0.98 Q0.9,1 0.88,1 H0.12 Q0.1,1 0.1,0.98 Q0.1,0.932 0.06,0.932 Q0,0.932 0,0.9 V0.1 Q0,0.068 0.06,0.068 Q0.1,0.068 0.1,0.02 Q0.1,0 0.12,0 Z" fill="none" vector-effect="non-scaling-stroke"/>
        </svg>
        <img class="bouquet" src="img/decor/bouquet.svg" alt="" aria-hidden="true">
      </div>
    </header>

    <!-- ===== Save the Date: flower gate opens as you scroll ===== -->
    <section class="opening" id="date">
      <div class="opening-track" id="track">
        <div class="opening-stage" id="stage">
          <div class="stage-content">
            <p class="eyebrow">Our celebration</p>
            <h2 class="script savedate">Save the Date</h2>
            <div class="datecard">
              <p class="script month" id="d-month"></p>
              <p class="bigday" id="d-day"></p>
              <p class="year" id="d-year"></p>
              <p class="cd-label">Countdown</p>
              <div class="count" id="countdown" aria-live="off"></div>
            </div>
          </div>
          <div class="door l" aria-hidden="true"><img class="dimg" src="img/decor/door.svg" alt=""><img class="hand" src="img/decor/hand-open.svg" alt=""></div>
          <div class="door r" aria-hidden="true"><img class="dimg" src="img/decor/door.svg" alt=""><img class="hand" src="img/decor/hand-open.svg" alt=""></div>
          <div class="hint" aria-hidden="true"><img class="swipe-hand" src="img/decor/hand-point.svg" alt=""><span>Scroll to open</span></div>
          <div class="confetti" id="confetti" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section class="block lt-host" id="ceremony">
      <h2 class="cart">Ceremony Info</h2>
      <div class="parents" id="parents"></div>
      <p class="caps announce" id="announcement"></p>
      <p class="script full" id="groom-full"></p>
      <p class="script amp">&amp;</p>
      <p class="script full" id="bride-full"></p>
    </section>

    <section class="block lt-host" id="celebration">
      <h2 class="cart">The Celebration</h2>
      <p class="script joy">Join us in our joy</p>
      <div id="event-list"></div>
    </section>

    <section class="block lt-host" id="gallery">
      <h2 class="cart">Photo Gallery</h2>
      <div class="flow" id="flow" aria-roledescription="carousel"></div>
      <p class="muted center counter" id="counter"></p>
    </section>

    <section class="block lt-host" id="reception">
      <div class="cal" id="cal"></div>
      <p class="center"><button id="cal-btn" class="link" type="button">Add to Calendar</button></p>
    </section>

    <section class="block lt-host" id="venue">
      <h2 class="cart" id="venue-title"></h2>
      <div class="venue-card reveal">
        <span class="v-ring"><svg width="26" height="26"><use href="#pin"/></svg></span>
        <h3 id="venue-name"></h3>
        <p class="v-addr" id="venue-addr"></p>
        <hr>
        <p class="v-chip" id="chip-area"><svg width="16" height="16"><use href="#nav"/></svg><span></span></p>
        <p class="v-chip" id="chip-note"><svg width="16" height="16"><use href="#mapicon"/></svg><span></span></p>
        <a id="dir-btn" class="v-btn" target="_blank" rel="noopener">Get Directions <svg width="18" height="18"><use href="#nav"/></svg></a>
      </div>
      <iframe id="map" class="map" title="Venue map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>

    <section class="block plain" id="album" hidden>
      <h2 class="plain-h">Photo Album</h2>
      <p class="center" id="album-note"></p>
      <p class="center"><a id="album-link" class="pill" target="_blank" rel="noopener">Open full album</a></p>
    </section>

    <footer class="closing" id="closing">
      <div id="petals-fall" aria-hidden="true"></div>
      <p class="script thanks-q reveal" id="thanks-q"></p>
      <div class="mono reveal" id="mono"></div>
      <p class="thanks reveal" id="thanks"></p>
      <p class="presence reveal" id="presence"></p>
      <img class="foot-lotus" src="img/decor/footer-white.svg" alt="" aria-hidden="true">
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
