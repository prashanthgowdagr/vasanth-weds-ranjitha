<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vasanth & Ranjitha — Wedding Invitation</title>
  <meta name="description" content="You are invited to the wedding of Vasanth & Ranjitha. 28–29 November 2026, Hiriyur.">
  <meta name="theme-color" content="#cfdcb8">

  <!-- Link preview (WhatsApp / iMessage) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vasanth & Ranjitha — Wedding Invitation">
  <meta property="og:description" content="28–29 November 2026 · Hiriyur. Join us in celebrating.">
  <meta property="og:url" content="https://vasanth-weds-ranjitha.q21.in/">
  <meta property="og:image" content="https://vasanth-weds-ranjitha.q21.in/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">
  <div class="bg-garden" aria-hidden="true"></div>
  <img class="bg-edge l" src="img/decor/edge.svg" alt="" aria-hidden="true">
  <img class="bg-edge r" src="img/decor/edge.svg" alt="" aria-hidden="true">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- notched-corner photo frame -->
      <clipPath id="notch" clipPathUnits="objectBoundingBox">
        <path d="M0.12,0 H0.88 Q0.9,0 0.9,0.02 Q0.9,0.068 0.94,0.068 Q1,0.068 1,0.1 V0.9 Q1,0.932 0.94,0.932 Q0.9,0.932 0.9,0.98 Q0.9,1 0.88,1 H0.12 Q0.1,1 0.1,0.98 Q0.1,0.932 0.06,0.932 Q0,0.932 0,0.9 V0.1 Q0,0.068 0.06,0.068 Q0.1,0.068 0.1,0.02 Q0.1,0 0.12,0 Z"/>
      </clipPath>
      <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></symbol>
      <symbol id="pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11.2A7 7 0 0 1 19 9.8C19 14.8 12 21 12 21z"/><circle cx="12" cy="10" r="2.6"/></g></symbol>
      <symbol id="nav" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7 2.5 2.5 7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <!-- ===== Landing: tap OPEN ===== -->
  <div id="intro" class="intro" role="dialog" aria-label="Wedding invitation">
    <div id="petals" aria-hidden="true"></div>
    <div class="intro-card">
      <img class="ic-tl" src="img/decor/corner.svg" alt="">
      <img class="ic-br" src="img/decor/corner.svg" alt="">
      <div class="heart-badge"><svg width="46" height="46" viewBox="0 0 24 24"><use href="#heart" fill="#e11d48"/></svg></div>
      <p class="script i-name" id="i-groom"></p>
      <p class="script i-amp">&amp;</p>
      <p class="script i-name" id="i-bride"></p>
      <svg class="infinity" viewBox="0 0 220 90" aria-label="V and R" role="img">
        <path class="loop-glow" d="M92.1 21.8A38 38 0 1 0 92.1 68.2L127.9 21.8A38 38 0 1 1 127.9 68.2Z" fill="none" stroke="#e9c46a" stroke-width="7" stroke-opacity=".45" stroke-linejoin="round"/>
        <path class="loop" d="M92.1 21.8A38 38 0 1 0 92.1 68.2L127.9 21.8A38 38 0 1 1 127.9 68.2Z" fill="none" stroke="#5b7d38" stroke-width="3" stroke-linejoin="round"/>
        <text x="62" y="56" text-anchor="middle" class="inf-l">V</text>
        <text x="158" y="56" text-anchor="middle" class="inf-l">R</text>
      </svg>
      <p class="i-guest" id="i-guest" hidden></p>
      <button id="open-btn" class="pill">Open Invitation</button>
    </div>
  </div>

  <button id="music-btn" class="music" aria-label="Pause or play music" hidden>
    <svg width="20" height="20" viewBox="0 0 20 20"><g fill="#fff"><rect class="bar" x="3" y="9" width="3" height="8"/><rect class="bar" x="8.5" y="4" width="3" height="13"/><rect class="bar" x="14" y="7" width="3" height="10"/></g></svg>
  </button>

  <div class="page" id="page">

    <!-- ===== Opening page: names + photo ===== -->
    <header class="hero lt-host" id="home">
      <span class="amp-mark script" aria-hidden="true">&amp;</span>
      <p class="top-name left" id="t-groom"></p>
      <p class="top-name right" id="t-bride"></p>
      <div class="photo">
        <div class="photo-img" data-img="hero"></div>
        <svg class="photo-line" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0.12,0 H0.88 Q0.9,0 0.9,0.02 Q0.9,0.068 0.94,0.068 Q1,0.068 1,0.1 V0.9 Q1,0.932 0.94,0.932 Q0.9,0.932 0.9,0.98 Q0.9,1 0.88,1 H0.12 Q0.1,1 0.1,0.98 Q0.1,0.932 0.06,0.932 Q0,0.932 0,0.9 V0.1 Q0,0.068 0.06,0.068 Q0.1,0.068 0.1,0.02 Q0.1,0 0.12,0 Z" fill="none" vector-effect="non-scaling-stroke"/>
        </svg>
        <img class="bouquet" src="img/decor/bouquet.svg" alt="" aria-hidden="true">
      </div>
    </header>

    <!-- ===== Save the Date: flower gate opens as you scroll ===== -->
    <section class="opening" id="date">
      <div class="opening-track" id="track">
        <div class="opening-stage" id="stage">
          <div class="stage-content">
            <p class="eyebrow">Our celebration</p>
            <h2 class="script savedate">Save the Date</h2>
            <div class="datecard">
              <p class="script month" id="d-month"></p>
              <p class="bigday" id="d-day"></p>
              <p class="year" id="d-year"></p>
              <p class="cd-label">Countdown</p>
              <div class="count" id="countdown" aria-live="off"></div>
            </div>
          </div>
          <div class="door l" aria-hidden="true"><img class="dimg" src="img/decor/door.svg" alt=""><img class="hand" src="img/decor/hand-open.svg" alt=""></div>
          <div class="door r" aria-hidden="true"><img class="dimg" src="img/decor/door.svg" alt=""><img class="hand" src="img/decor/hand-open.svg" alt=""></div>
          <div class="hint" aria-hidden="true"><img class="swipe-hand" src="img/decor/hand-point.svg" alt=""><span>Scroll to open</span></div>
          <div class="confetti" id="confetti" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section class="block lt-host" id="ceremony">
      <h2 class="cart">Ceremony Info</h2>
      <div class="parents" id="parents"></div>
      <p class="caps announce" id="announcement"></p>
      <p class="script full" id="groom-full"></p>
      <p class="script amp">&amp;</p>
      <p class="script full" id="bride-full"></p>
    </section>

    <section class="block lt-host" id="celebration">
      <h2 class="cart">The Celebration</h2>
      <p class="script joy">Join us in our joy</p>
      <div id="event-list"></div>
    </section>

    <section class="block lt-host" id="gallery">
      <h2 class="cart">Photo Gallery</h2>
      <div class="flow" id="flow" aria-roledescription="carousel"></div>
      <p class="muted center counter" id="counter"></p>
    </section>

    <section class="block lt-host" id="reception">
      <h2 class="cart">Reception Info</h2>
      <p class="caps strong">The reception will take place at:</p>
      <div id="reception-date"></div>
      <div class="times" id="times"></div>
      <div class="cal" id="cal"></div>
      <p class="center"><button id="cal-btn" class="link" type="button">Add to Calendar</button></p>
    </section>

    <section class="block lt-host" id="venue">
      <h2 class="cart" id="venue-title"></h2>
      <p class="venue-name" id="venue-name"></p>
      <p class="venue-addr" id="venue-addr"></p>
      <iframe id="map" class="map" title="Venue map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <p class="center"><a id="dir-btn" class="dir" target="_blank" rel="noopener"><svg width="18" height="18"><use href="#nav"/></svg> Get directions</a></p>
    </section>

    <section class="block plain" id="album" hidden>
      <h2 class="plain-h">Photo Album</h2>
      <p class="center" id="album-note"></p>
      <p class="center"><a id="album-link" class="pill" target="_blank" rel="noopener">Open full album</a></p>
    </section>

    <footer class="closing" id="closing">
      <div id="petals-fall" aria-hidden="true"></div>
      <p class="script thanks-q reveal" id="thanks-q"></p>
      <div class="mono reveal" id="mono"></div>
      <p class="thanks reveal" id="thanks"></p>
      <p class="presence reveal" id="presence"></p>
      <img class="foot-lotus" src="img/decor/footer-white.svg" alt="" aria-hidden="true">
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
